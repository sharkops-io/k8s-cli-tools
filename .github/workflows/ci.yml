# k8s-cli-tools is every deploy job's image, so a tag reaches `latest` only
# after BOTH architectures have been built natively and smoke-tested.
# Ported from the GitLab pipeline: build per arch -> smoke per arch -> one
# multi-arch tag -> promote.
#
#   pull_request   build and smoke both arches locally; nothing pushed
#   master         :<sha> and :master
#   tag X.Y.Z      :X.Y.Z, then :latest
name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sharkops-io/k8s-cli-tools

jobs:
  secret-scan:
    uses: sharkops-io/.github/.github/workflows/secret-scan.yml@main

  build:
    needs: [secret-scan]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Image tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else echo "tag=${SHA:0:8}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (native, no emulation)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test
        env:
          REF: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          UNAME: ${{ matrix.uname }}
        run: |
          docker run --rm -e UNAME "$REF" sh -ec '
            test "$(uname -m)" = "$UNAME"
            kubectl version --client
            helm version
            helm plugin list | grep -q "^diff"
            helmfile --version
            kustomize version
            rancher --version
            git --version'
      - name: Push the per-arch tag
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
        run: docker push "$REF"
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  manifest:
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One multi-arch tag, then promote
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          if [ "$REF_TYPE" = tag ]; then promote=latest; else promote="$BRANCH"; fi
          docker buildx imagetools create -t "$IMAGE:$promote" "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$promote"

  # The ARC runner variant (Dockerfile.runner): the GitHub Actions runner plus
  # the exact binaries of the multi-arch tag built above. Published as
  # :<tag>-runner and promoted to :<promote>-runner alongside the main image.
  # A PR builds it against :latest without pushing.
  runner-image:
    needs: [build, manifest]
    if: always() && needs.build.result == 'success' && (needs.manifest.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: t
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "tools=$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:pr-runner" >> "$GITHUB_OUTPUT"
          else
            if [ "$REF_TYPE" = tag ]; then promote=latest; else promote="$BRANCH"; fi
            echo "tools=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
            printf 'tags<<EOF\n%s\n%s\nEOF\n' "$IMAGE:$TAG-runner" "$IMAGE:$promote-runner" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          build-args: TOOLS_IMAGE=${{ steps.t.outputs.tools }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.t.outputs.tags }}
      - name: Smoke test (amd64)
        env:
          TOOLS: ${{ steps.t.outputs.tools }}
        run: |
          docker buildx build --platform linux/amd64 -f Dockerfile.runner --build-arg TOOLS_IMAGE="$TOOLS" -t runner-smoke --load .
          docker run --rm runner-smoke bash -ec '
            test "$(id -un)" = runner
            kubectl version --client
            helm plugin list | grep -q "^diff"
            helmfile --version
            kustomize version
            git --version
            test -x /home/runner/run.sh'
